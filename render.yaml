# Veritabanı Supabase Postgres'te barındırılıyor; Render artık Postgres
# yönetmiyor. Eski `databases:` bölümü kaldırıldı — blueprint sync, silinmiş
# ücretsiz Postgres'i her push'ta yeniden yaratmaya çalışıp "Deploy failed"
# maillerine yol açıyordu. DATABASE_URL panelde elle Supabase'e işaretli.

services:
  - type: web
    name: hersey-yolunda-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SCHEDULER_MODE
        value: external
      # Üretim veritabanı Supabase Postgres'te; bağlantı dizesi Render panelinde
      # elle tanımlı. fromDatabase kullanma: blueprint sync, DATABASE_URL'i
      # eski Render Postgres'e geri çevirip canlı veriyi koparabilir.
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: LOOKUP_KEY
        sync: false
      - key: TICK_SECRET
        sync: false
