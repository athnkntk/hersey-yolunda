name: HerseyYolunda
options:
  bundleIdPrefix: com.herseyyolunda
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '11'
    DEVELOPMENT_TEAM: '2HBFPNCMR8'
    CODE_SIGN_STYLE: Automatic
    HY_API_URL: ''
    HY_INVITE_DOMAIN: ''
  configs:
    Debug:
      HY_API_URL: 'http://Atahan-MacBook-Air.local:3000/v1'
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      HY_API_URL: 'https://92.205.190.116.sslip.io/v1'
targets:
  HerseyYolunda:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [GoogleService-Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herseyyolunda.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Herşey Yolunda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [tr, en]
        UILaunchScreen: {}
        HYAPIURL: $(HY_API_URL)
        HYInviteDomain: $(HY_INVITE_DOMAIN)
        HYKeychainGroup: $(AppIdentifierPrefix)com.herseyyolunda.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: invitation
            CFBundleURLSchemes: [herseyyolunda]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.herseyyolunda.shared]
        keychain-access-groups: ['$(AppIdentifierPrefix)com.herseyyolunda.shared']
        aps-environment: development
    dependencies:
      - target: YolundaWidget
  YolundaWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herseyyolunda.app.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Herşey Yolunda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [tr, en]
        HYAPIURL: $(HY_API_URL)
        HYKeychainGroup: $(AppIdentifierPrefix)com.herseyyolunda.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.herseyyolunda.shared]
        keychain-access-groups: ['$(AppIdentifierPrefix)com.herseyyolunda.shared']
  YolundaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HerseyYolunda
  YolundaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HerseyYolunda
schemes:
  HerseyYolunda:
    build:
      targets:
        HerseyYolunda: all
    test:
      targets: [YolundaTests, YolundaUITests]
